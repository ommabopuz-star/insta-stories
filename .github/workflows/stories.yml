name: Instagram istoriya

on:
  schedule:
    - cron: "*/15 3-18 * * *"   # UTC 03:00–18:59 = Toshkent 08:00–23:59, har 15 daqiqa
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q requests pynacl

      - name: Tick
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python bot.py

      - name: Holatni saqlash
        if: always()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "stories-bot"
            git config user.email "stories-bot@users.noreply.github.com"
            git add state.json
            git commit -m "holat: $(date -u +%F' '%H:%M)"
            git pull --rebase -X theirs || true
            git push
          fi
